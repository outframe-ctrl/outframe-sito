<script>
  /* giorno / notte: vale la scelta salvata del visitatore, altrimenti come il suo telefono o computer (modalità chiara o scura) */
  (function () { var t = null; try { t = localStorage.getItem('outframe-tema'); } catch (e) {}
    if (t !== 'giorno' && t !== 'notte') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'notte' : 'giorno';
    document.documentElement.dataset.tema = t; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<body>
<style>
  /* OUTFRAME: copertina con il pittogramma, sezioni una dopo l'altra (Progetti, Artisti, Contatti),
     pagine dedicate per progetti, artisti e About us. Look carta/inchiostro di giorno; di notte (pulsante accanto a IT/EN) i colori si invertono. */
  :root{
    --paper:#FFFFFF;
    --ink:#15130F;
    --grey:#6F6A5D;
    --line:#D6D3CC;
    --frame:#F3F2EF;   /* fondo dei riquadri foto */
    --fondo:#0d0c0a;   /* il nero intorno al sito, lo stesso dei contatti */
    --su-fondo:#fff;            /* testo sulle bande (fascia in alto, contatti, chiusura dei progetti) */
    --su-fondo-2:#A9A59C;       /* etichette sulle bande */
    --su-fondo-3:#8F8A80;       /* testo spento sulle bande */
    --su-fondo-4:#C9C4BA;
    --su-fondo-linea:rgba(255,255,255,.18);
    --paper-0:rgba(255,255,255,0);   /* il foglio trasparente, per le sfumature */
    --velo:rgba(10,9,7,.55);
    --logo-filtro:none;               /* il logo nero sul foglio */
    --logo-su-fondo:invert(1) brightness(2);   /* il logo sulle bande */
    --mono:'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
    --ease:cubic-bezier(.22,.8,.28,1);
    color-scheme:light;
  }
  /* NOTTE: il contrario del giorno. Il foglio diventa nero, le bande (in alto, contatti, chiusura dei progetti) diventano bianche */
  :root[data-tema="notte"]{
    --paper:#0d0c0a; --ink:#F2EFE8; --grey:#A19C90; --line:#34312B; --frame:#1a1917; --fondo:#FFFFFF;
    --su-fondo:#0d0c0a; --su-fondo-2:#6F6A5D; --su-fondo-3:#7C776C; --su-fondo-4:#4A463F; --su-fondo-linea:rgba(0,0,0,.16);
    --paper-0:rgba(13,12,10,0); --velo:rgba(255,255,255,.6); --logo-filtro:invert(1); --logo-su-fondo:none;
    color-scheme:dark;
  }
  /* il pulsante giorno/notte, nella fascia in alto accanto a IT/EN: un cerchio mezzo pieno che gira */
  .tema-btn{display:inline-grid; place-items:center; width:22px; height:22px; margin-right:18px; color:var(--su-fondo-3); transition:color .2s;}
  .tema-btn:hover{color:var(--su-fondo);}
  .tema-btn svg{width:13px; height:13px; display:block; transition:transform .7s var(--ease);}
  :root[data-tema="notte"] .tema-btn svg{transform:rotate(180deg);}
  .tema-btn:focus-visible{outline:1px dashed var(--su-fondo); outline-offset:3px;}
  /* il passaggio dal giorno alla notte: i colori scorrono per poco più di mezzo secondo */
  .tema-shift, .tema-shift *, .tema-shift *::before, .tema-shift *::after{transition:background-color .6s ease, color .6s ease, border-color .6s ease, box-shadow .6s ease, filter .6s ease, stroke .6s ease, fill .6s ease !important;}
  .tema-shift .tema-btn svg{transition:transform .7s var(--ease) !important;}
  /* loghi e pittogramma: neri di giorno, bianchi di notte */
  .logo-mark img, .cover-foot img{filter:var(--logo-filtro);}
  .cover-mark svg rect{stroke:var(--ink);}
  .cover-mark svg line{stroke:var(--paper);}
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%; overscroll-behavior-x:none;}
  body{
    font-family:var(--mono); color:var(--ink); background:var(--fondo);
    overflow-x:hidden; min-height:100%;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:1px dashed var(--ink); outline-offset:4px;}

  .frame{
    position:relative; z-index:1;
    max-width:1200px; margin:28px auto 24px; min-height:calc(100% - 52px);
    background:var(--paper); border:1px solid var(--line);
    display:flex; flex-direction:column;
  }

  header, footer{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 28px; border-bottom:1px solid var(--line);
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  }
  header{display:grid; grid-template-columns:1fr auto 1fr;}
  header > :last-child{justify-self:end;}
  footer{border-bottom:none; border-top:1px solid var(--line);}
  .logo{display:flex; align-items:center; text-decoration:none; font-weight:600; letter-spacing:.14em; font-size:13px;}
  .logo-mark img{height:42px !important; transition:transform .25s var(--ease); transform-origin:left center;}
  @media (hover:hover){ a.logo-mark:hover img{transform:scale(1.1);} }   /* il logo in alto si ingrandisce un po' passandoci sopra */
  @media (prefers-reduced-motion: reduce){ .logo-mark img{transition:none;} }
  .logo img{height:30px; width:auto; display:block;}
  .center-label{color:var(--grey);}
  nav{display:flex; gap:22px;}
  nav button{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.55; transition:opacity .2s;}
  nav button:hover, nav button[aria-current="true"]{opacity:1;}
  nav button[aria-current="true"]{text-decoration:underline; text-underline-offset:4px;}

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:44px 28px; min-width:0;}

  /* pagina dedicata (progetti, artisti, About us), sopra il sito */
  .panel{
    position:fixed; inset:0; z-index:5; display:flex; justify-content:center; align-items:flex-start;
    padding:24px; overflow-y:auto; background:var(--velo);
  }
  .panel[hidden]{display:none;}
  .panel-inner{
    width:100%; max-width:1200px; min-height:calc(100% - 0px);
    background:var(--paper); border:1px solid var(--line); display:flex; flex-direction:column;
  }

  .prose p{font-size:15px; line-height:1.7; max-width:62ch;}
  .prose p + p{margin-top:1em;}

  .contacts{display:grid; gap:18px; margin-top:6px;}
  .contacts dt{font-size:10px; color:var(--grey); letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px;}
  .contacts dd{font-size:18px; user-select:all;}
  .contacts dd a{text-decoration:none; border-bottom:1px solid var(--line);}
  .contacts dd a:hover{border-color:var(--ink);}
  /* pagina Progetti */

  .prose h4{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin:2.6em 0 1em; padding-top:14px; border-top:1px solid var(--line); max-width:62ch;}
  .prose h4:first-child{margin-top:0;}
  .prose h5{font-size:15px; font-weight:700; margin:1.8em 0 .6em;}
  .prose em{font-style:italic;}
  .credits{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:18px 28px; max-width:62ch;}
  .credits .credit{display:flex; flex-direction:column; gap:2px; margin:0 !important;}
  .credits .credit span{color:var(--grey); font-size:13px;}
  .article{z-index:6; background:var(--fondo);}
  .article.slide{animation:pagina-entra .75s cubic-bezier(.7,0,.2,1) both;}
  .article.slide.closing{animation:pagina-esce .52s cubic-bezier(.6,0,.4,1) both;}
  @keyframes pagina-entra{from{transform:translateX(100%);} to{transform:none;}}
  @keyframes pagina-esce{from{transform:none;} to{transform:translateX(100%);}}
  /* pagina About us: testo a tutta larghezza su schermo largo */
  #artBody.about-page .prose p{font-size:15px; line-height:1.7;}
  @media (min-width:901px){ #artBody.about-page .prose p{max-width:none;} }
  .article-body{padding:40px 28px 80px; display:flex; flex-direction:column; gap:28px;}
  .article-body h2{font-size:48px; font-weight:700; text-transform:uppercase; line-height:1.02; text-wrap:balance;}
  .article-body figure img{display:block; max-width:100%; max-height:72vh; width:auto; height:auto;}

  @media (max-width:640px){ .article-body{padding:28px 16px 56px;} .article-body h2{font-size:30px;} }

  .text-link{font-size:11px; letter-spacing:.08em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--ink); padding-bottom:2px;}
  .text-link:hover{opacity:.6;}
  /* nomi che portano a un'altra pagina del sito (es. dal progetto all'artista) */
  .prose a.int-link{color:inherit; text-decoration:none; border-bottom:1px solid var(--line); transition:border-color .2s;}
  .prose a.int-link:hover{border-bottom-color:var(--ink);}
  /* icona di Instagram sotto la bio: stessa distanza dal testo per tutti gli artisti; niente spazio sotto l'icona (così la foto accanto finisce esattamente lì) */
  .ig-link, .prose p.ig-link{margin-top:22px; display:flex;}
  .ig-icon{display:inline-flex; color:var(--ink); transition:opacity .2s;}
  .ig-icon svg{width:24px; height:24px; fill:currentColor; display:block;}
  .ig-icon:hover{opacity:.6;}
  /* nomi degli artisti che portano al loro Instagram */
  .prose strong > .text-link{font-size:inherit; letter-spacing:inherit; text-transform:none; border-bottom-color:var(--line); padding-bottom:1px; transition:border-color .2s;}
  .prose strong > .text-link:hover{opacity:1; border-bottom-color:var(--ink);}
  .catalogs{display:grid; grid-template-columns:repeat(2, minmax(0, 220px)); gap:24px; margin:2em 0 .5em;}
  .prose .catalogs + p{margin-top:1.8em;}   /* spazio tra i cataloghi e il paragrafo che segue */
  .catalog{display:flex; flex-direction:column; gap:8px; text-align:left; color:var(--ink);}
  .catalog img{display:block; width:100%; height:auto; border:1px solid var(--line); transition:transform .3s var(--ease);}
  .catalog:hover img{transform:translateY(-4px);}
  .cat-title{font-size:14px; font-weight:600;}
  .cat-go{font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--ink); align-self:flex-start; padding-bottom:2px;}
  /* sottolineature: invece di comparire di colpo si riempiono da sinistra a destra (una linea di 1px disegnata come sfondo) */
  /* foto a tutto schermo */
  #artBody .t-figs img, #artBody .otrack .ofr{cursor:zoom-in;}
  .lb{position:fixed; inset:0; z-index:9; background:#0d0c0a; color:#EDEAE2; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
    padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);}
  .lb[hidden]{display:none;}
  .lb-top{display:flex; justify-content:space-between; align-items:center; padding:16px 8px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;}
  .lb-count{color:#9a958a; font-variant-numeric:tabular-nums;}
  /* "Chiudi": la sottolineatura compare passandoci sopra, e la scritta si ingrandisce un po' */
  .lb-close, .v-close{border-bottom:1px solid transparent; background-image:linear-gradient(currentColor, currentColor); background-repeat:no-repeat; background-size:0% 1px; background-origin:border-box; background-position:left bottom; transition:background-size .4s var(--ease), transform .25s var(--ease); transform-origin:right center;}
  .lb-close{color:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:10px 0 2px;}
  @media (hover:hover){ .lb-close:hover, .v-close:hover{background-size:100% 1px; transform:scale(1.1);} }
  @media (prefers-reduced-motion: reduce){ .lb-close, .v-close{transition:none;} }
  /* pagine degli artisti: dietro l'opera, al posto del nero, la stessa opera sfocata e ingrandita (due strati che si scambiano in dissolvenza) */
  .lb-bg{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; display:none;}
  .lb.sfondo-opera .lb-bg{display:block;}
  .lb-bg i{position:absolute; inset:-10%; background:#0d0c0a center / cover no-repeat; filter:blur(46px) saturate(1.15) brightness(.5); transform:scale(1.3); opacity:0; transition:opacity .6s ease;}
  .lb-bg i.on{opacity:1;}
  .lb-top, .lb-stage, .lb-cap{position:relative; z-index:1;}
  .lb-nav{z-index:2;}
  .lb.sfondo-opera .lb-cap, .lb.sfondo-opera .lb-top{text-shadow:0 1px 10px rgba(0,0,0,.45);}
  .lb.sfondo-opera .lb-count, .lb.sfondo-opera .lb-cap{color:#D8D3C8;}
  @media (prefers-reduced-motion: reduce){ .lb-bg i{transition:none;} }
  .lb-stage{position:relative; min-height:0; touch-action:pan-y; user-select:none; -webkit-user-select:none;}
  .lb-stage img{position:absolute; inset:0 64px; margin:auto; display:block; max-width:calc(100% - 128px); max-height:100%; width:auto; height:auto; opacity:1; transition:opacity .25s ease;}
  .lb-stage img.load{opacity:0;}
  .lb-cap{min-height:56px; padding:14px 8px 22px; text-align:center; font-size:12px; line-height:1.5; color:#BDB8AE;}
  .lb-cap strong{display:block; color:#EDEAE2; font-size:13px; font-weight:600; margin-bottom:2px;}
  .lb-cap .lb-sec{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; display:grid; place-items:center; font-size:22px; color:#EDEAE2; opacity:.7; transition:opacity .2s, transform .25s var(--ease);}
  .lb-nav:hover{opacity:1;}
  /* passandoci sopra con il cursore la freccia si ingrandisce un po' */
  @media (hover:hover){ .lb-nav:hover{transform:translateY(-50%) scale(1.18);} }
  @media (prefers-reduced-motion: reduce){ .lb-nav{transition:opacity .2s;} }
  .lb-nav svg{display:block; width:22px; height:40px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;}
  .lb-prev{left:16px;} .lb-next{right:16px;}
  .lb-nav[hidden]{display:none;}
  @media (max-width:640px){
    .lb-stage img{inset:0; max-width:100%;}
    .lb-nav{top:auto; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:none; width:44px; height:44px;}
    .lb-nav:hover{transform:scale(1.18);}
    .lb-nav svg{width:16px; height:30px;}
    .lb-cap{padding:12px 60px 22px;}
  }
  /* visualizzatore cataloghi */
  .viewer{position:fixed; inset:0; z-index:8; background:#141310; color:#EDEAE2; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);}
  .viewer[hidden]{display:none;}
  .v-top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:16px 8px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;}
  .v-top, .v-bar{position:relative; z-index:2;}
  .v-title{font-weight:600;}
  .v-where{color:#9a958a; font-variant-numeric:tabular-nums;}
  .v-close{justify-self:end; color:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding-bottom:2px;}
  .v-stage{flex:1; min-height:0; display:grid; place-items:center; touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:pointer;}
  /* libro 3D: i fogli girano sulla rilegatura */
  .v-book{position:relative; width:calc(var(--vpw) * 2); height:var(--vph);}
  .v-shift{position:absolute; inset:0; perspective:calc(var(--vpw) * 5); transition:transform .7s cubic-bezier(.45,.05,.25,1);}
  .v-leaf{position:absolute; left:50%; top:0; width:var(--vpw); height:var(--vph); transform-origin:left center; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.45,.05,.25,1);}
  .v-leaf.turned{transform:rotateY(-180deg);}
  .v-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:#fff; overflow:hidden;}
  .v-face.back{transform:rotateY(180deg);}
  .v-face img, .v-sheet img{width:100%; height:100%; display:block; object-fit:cover; pointer-events:none; -webkit-user-drag:none;}
  .v-face::after{content:''; position:absolute; inset:0; pointer-events:none;}
  .v-face.front::after{background:linear-gradient(to right, rgba(0,0,0,.16), rgba(0,0,0,.04) 6%, transparent 14%);}
  .v-face.back::after{background:linear-gradient(to left, rgba(0,0,0,.16), rgba(0,0,0,.04) 6%, transparent 14%);}
  .v-face.cover::after{background:linear-gradient(to right, rgba(0,0,0,.18), transparent 4%);}
  .v-face.backcover::after{background:linear-gradient(to left, rgba(0,0,0,.18), transparent 4%);}
  .v-floor{position:absolute; top:0; height:100%; box-shadow:0 10px 40px rgba(0,0,0,.55); transition:left .7s cubic-bezier(.45,.05,.25,1), width .7s cubic-bezier(.45,.05,.25,1);}
  .v-single{position:relative; width:var(--vpw); height:var(--vph); perspective:calc(var(--vpw) * 4);}
  .v-sheet{position:absolute; inset:0; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.5); transform-origin:left center; overflow:hidden;}
  @media (prefers-reduced-motion: reduce){ .v-leaf, .v-shift, .v-floor{transition-duration:.01s;} }
  .v-bar{display:flex; justify-content:center; gap:28px; padding:14px 0 18px;}
  .v-bar button{color:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid currentColor; padding-bottom:2px;}
  .v-bar button:disabled{opacity:.25; cursor:default;}
  .v-close:focus-visible, .v-bar button:focus-visible{outline:1px dashed #EDEAE2; outline-offset:4px;}
  /* impaginazione testo + foto affiancate */

  .t-sec{display:grid; grid-template-columns:minmax(0, 60ch) minmax(0, 1fr); gap:56px; align-items:start; margin-top:3em;}
  .t-sec:first-child{margin-top:0;}
  .t-sec.sub{margin-top:1.8em;}
  .t-sec.sub .t-text > h5:first-child{margin-top:0;}
  .t-sec .t-text > h4:first-child{margin-top:0;}
  /* la colonna foto prende l'altezza del testo accanto (minimo 340px): niente vuoti nel testo */
  .t-figs{align-self:stretch; min-height:min(340px, 60vh); contain:size; display:grid; gap:12px;}
  .t-figs figure{height:100%; min-height:0; display:flex; flex-direction:column;}
  .t-figs img{display:block; flex:1; min-height:0; width:100%; height:100%; object-fit:contain; object-position:left top;}
  /* due foto: una sopra l'altra, a dimensione piena (non legate all'altezza del testo) */
  .t-figs.duo{grid-template-columns:minmax(0,1fr); contain:none; min-height:0; align-self:start; gap:16px;}
  .t-figs.duo figure{height:auto;}
  .t-sec:has(.t-figs.duo) .t-text{position:sticky; top:24px;}
  /* tante foto: una sotto l'altra, grandi quanto la colonna; scorrono con la pagina mentre il testo resta accanto */
  .t-sec:has(.t-figs.grid){grid-template-columns:minmax(0, 44ch) minmax(0, 1fr); gap:48px;}
  .t-figs video{display:block; width:100%; height:auto; background:#111;}
  .t-figs.duo video{width:min(100%, 420px);}
  .t-figs.duo.grid img{width:100%; height:auto; max-height:none; object-fit:initial;}
  .t-figs.duo.grid{display:block; columns:2; column-gap:14px;}
  .t-figs.duo.grid figure{break-inside:avoid; margin-bottom:14px;}
  /* 3 o più foto: restano una sopra l'altra, ferme sullo schermo mentre scorre il capitolo */
  .t-sec:has(.t-figs.stack){align-items:stretch;}
  .t-figs.stack{contain:none; min-height:0; align-self:stretch;}
  .t-figs.stack .stack-in{position:sticky; top:24px; height:min(calc(100vh - 48px), 100%); max-height:1000px; display:flex; flex-direction:column; gap:12px;}
  .t-figs.stack figure{flex:1 1 0; min-height:0; height:auto;}
  .t-figs.stack img{width:100%; height:100%; object-fit:contain; object-position:left center;}
  .t-figs.stack .stack-in:has(figure:nth-child(4)){display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:minmax(0,1fr);}
  .t-figs.stack .stack-in:has(figure:nth-child(4)) img{object-position:center;}
  .t-figs.duo img{width:min(100%, 420px); height:auto; flex:none; object-fit:initial;}
  .t-figs figcaption{font-size:10px; color:var(--grey); letter-spacing:.06em; text-transform:uppercase; margin-top:6px;}
  @media (max-width:900px){
    .t-sec{grid-template-columns:minmax(0,1fr); gap:20px;}

    .t-figs{contain:none; min-height:0;}
    .t-sec:has(.t-figs.duo) .t-text{position:static;}
    .t-sec:has(.t-figs.grid){grid-template-columns:minmax(0,1fr);}
    .t-figs.duo.grid{columns:1;}
    .t-figs.stack .stack-in{position:static; height:auto; max-height:none;}
    .t-figs.stack .stack-in:has(figure:nth-child(4)){display:flex;}
    .t-figs.stack figure{flex:none;}
    .t-figs.stack img{height:auto;}
    .t-figs figure{height:auto;}
    .t-figs img{height:auto; flex:none;}
  }
  /* selettore lingua IT / EN */
  .lang-switch{display:inline-flex; gap:14px; font-size:13px; letter-spacing:.08em; text-transform:uppercase;}
  .lang-switch button{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); padding:2px 0; border-bottom:1px solid transparent; background-image:linear-gradient(currentColor, currentColor); background-repeat:no-repeat; background-size:0% 1px; background-origin:border-box; background-position:left bottom; transition:color .2s, background-size .4s var(--ease);}
  .lang-switch button[aria-pressed="true"]{color:var(--ink); background-size:100% 1px;}
  .lang-switch button:hover{color:var(--ink);}
  .hdr-right{display:inline-flex; align-items:center; gap:24px; justify-self:end;}

  /* ===== pagina unica ===== */
  .top{position:sticky; top:0; z-index:4; background:var(--paper); display:flex; justify-content:space-between; align-items:center; gap:24px; border-bottom:none;}
  /* IT / EN in alto a destra, sulla fascia scura sopra il riquadro del sito (niente striscia in più) */
  .lang-bar{position:absolute; left:0; right:0; bottom:calc(100% + 1px); height:24px; display:flex; justify-content:flex-end; align-items:center; padding:0 28px; color:var(--su-fondo);}
  .panel-inner{position:relative;}
  /* pagine di progetti, artisti e About us: la riga con logo e il tasto per tornare indietro resta in alto mentre si scorre, come nella home */
  .panel-inner > header{position:sticky; top:-24px; z-index:4; background:var(--paper);}   /* -24px: la fascia scura sopra sale via e la riga si ferma in cima */
  @media (max-width:640px){ .panel-inner > header{top:-28px;} }
  /* pagine degli artisti: la linea sotto la riga in alto è larga come la linea sopra "Opere";
     scorrendo fino in fondo, la linea di "Opere" arriva sotto la riga e le due linee diventano una */
  .article.pag-artista .panel-inner > header{border-bottom:none;}
  /* foto accanto alla bio: allineata al margine destro della pagina (come la linea in alto e quella di "Opere") */
  /* ===== pagina dell'artista, impostata come Soden ===== */
  .article.pag-artista .article-body{gap:0;}
  /* in alto un'opera a tutta larghezza, con nome e luogo / anno in bianco */
  /* l'opera sale anche dietro la riga in alto (logo e tasto): finché si è sopra la foto la riga è trasparente, con logo e scritta bianchi */
  /* l'opera resta ferma (come la riga in alto) e il resto della pagina, un foglio bianco, le scorre sopra */
  .a-hero{position:sticky; top:-24px; z-index:0; margin:calc(-40px - var(--hh, 0px)) -28px 0; height:calc(min(64vh, 640px) + var(--hh, 0px)); min-height:360px; overflow:hidden; background:#1a1917;}
  .a-corpo{position:relative; z-index:1; background:var(--paper); margin:0 -28px; padding:64px 28px 80px;}
  .article.pag-artista .article-body{padding-bottom:0;}
  /* niente filo chiaro intorno: l'opera e la pagina arrivano dritte alle bande nere */
  .article.pag-artista .panel-inner{border-color:var(--fondo);}
  .a-hero::before{content:""; position:absolute; left:0; right:0; top:0; height:190px; z-index:1; background:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0)); pointer-events:none;}
  .panel-inner > header{transition:background-color .3s ease;}
  .panel-inner > header::after{transition:opacity .3s ease;}
  .article.su-foto .panel-inner > header{background:transparent;}
  .article.su-foto .panel-inner > header::after{opacity:0;}
  .article.su-foto #artLogo img{filter:invert(1);}
  .article.su-foto .close{color:#fff;}
  .a-hero img{position:absolute; inset:0; display:block; width:100%; height:100%; max-width:none; max-height:none; object-fit:cover;}
  .a-hero::after{content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.12) 50%, rgba(0,0,0,0) 75%); pointer-events:none;}
  /* nome e luogo / anno: stanno sull'opera ma salgono con la pagina (sono attaccati al foglio bianco) e svaniscono arrivando in cima */
  .a-hero-txt{position:absolute; left:28px; right:28px; bottom:calc(100% + 44px); z-index:1; color:#fff; text-shadow:0 1px 18px rgba(0,0,0,.28); pointer-events:none;}
  .article-body .a-hero-txt h2{font-size:clamp(34px, 5.4vw, 66px); font-weight:300; letter-spacing:.16em; line-height:1.08; text-transform:uppercase; text-wrap:balance;}
  .a-orig{margin-top:16px; font-size:13px; letter-spacing:.22em; text-transform:uppercase;}
  /* BIOGRAFIA / OPERE a sinistra, "‹ SFOGLIA ARTISTI ›" a destra */
  .a-tabs{display:flex; justify-content:space-between; align-items:center; gap:20px; font-size:13px; letter-spacing:.2em; text-transform:uppercase;}
  .a-tabs-l{display:flex; gap:40px;}
  .a-tabs button, .a-tabs button[aria-current="true"]{font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--grey); padding:4px 0; opacity:1; text-decoration:none; background-image:linear-gradient(currentColor, currentColor); background-repeat:no-repeat; background-size:0% 1px; background-position:left bottom 1px; transform-origin:left center; transition:color .2s, transform .25s var(--ease), background-size .4s var(--ease);}
  .a-tabs button.on, .a-tabs button:hover{color:var(--ink);}
  /* passandoci sopra con il cursore: sottolineati e un po' più grandi, come le voci del menu */
  @media (hover:hover){ .a-tabs button:hover, .a-tabs button[aria-current]:hover{background-size:100% 1px; transform:scale(1.1);} }
  @media (prefers-reduced-motion:reduce){ .a-tabs button{transition:color .2s;} }
  .a-tabs-r{display:flex; align-items:center; gap:14px; color:var(--grey);}
  .a-freccia{display:inline-flex; padding:6px 4px; color:var(--ink); transition:transform .2s ease;}
  .a-freccia svg{width:9px; height:15px; display:block;}
  @media (hover:hover){ .a-freccia:first-child:hover{transform:translateX(-3px);} .a-freccia:last-child:hover{transform:translateX(3px);} }
  /* biografia intera su due colonne: testo largo e arioso a sinistra, foto a destra */
  .a-bio{margin-top:52px;}
  .a-bio .t-sec{grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr); gap:72px;}
  .a-bio .t-text p{font-size:16px; line-height:1.95; max-width:64ch;}
  .a-bio .t-text p + p{margin-top:1.45em;}
  .a-bio .t-figs{contain:none; min-height:0; align-self:start; padding-top:10px;}   /* la foto parte all'altezza delle maiuscole della prima riga */
  .a-bio .t-figs figure{height:auto; display:block;}
  .a-bio .t-figs img{flex:none; width:100%; height:auto; max-height:min(80vh, 760px); object-fit:contain; object-position:right top;}
  .article.pag-artista .opere{margin-top:80px;}
  @media (max-width:900px){
    .a-bio .t-sec{grid-template-columns:minmax(0,1fr); gap:32px;}
    .a-bio .t-figs{padding-top:0;}
    .a-bio .t-figs img{max-height:none; object-position:left top;}
  }
  @media (max-width:640px){
    .a-hero{top:-28px; margin:calc(-28px - var(--hh, 0px)) -16px 0; height:calc(58vh + var(--hh, 0px)); min-height:320px;}
    .a-corpo{margin:0 -16px; padding:36px 16px 56px;}
    .a-hero-txt{left:16px; right:16px; bottom:calc(100% + 28px);}
    .article-body .a-hero-txt h2{font-size:30px; letter-spacing:.12em;}
    .a-orig{margin-top:10px; font-size:11px;}
    .a-tabs{font-size:11px; letter-spacing:.16em;}
    .a-tabs-l{gap:24px;}
    .a-sfoglia{display:none;}
    .a-tabs-r{gap:10px;}
    .a-bio{margin-top:32px;}
    .a-bio .t-text p{font-size:15px; line-height:1.85;}
    .a-bio .t-text p + p{margin-top:1.3em;}
    .article.pag-artista .opere{margin-top:56px;}
  }
  .article.pag-artista .panel-inner > header::after{content:''; position:absolute; left:28px; right:28px; bottom:0; border-bottom:1px solid var(--line);}
  @media (max-width:640px){ .article.pag-artista .panel-inner > header::after{left:16px; right:16px;} }
  .frame > .lang-bar{height:28px;}   /* pagina principale: la fascia in alto è mezzo cm più alta */
  .lang-bar .lang-switch button{color:var(--su-fondo-3);}
  .lang-bar .lang-switch button[aria-pressed="true"]{color:var(--su-fondo);}
  .lang-bar .lang-switch button:hover{color:var(--su-fondo);}
  #page{display:block; padding:0 28px;}
  /* ===== copertina ===== */
  .cover{--cover-h:560px; --title-size:clamp(34px, min(4.9vw, calc(var(--cover-h) * .14)), 66px); position:relative; height:var(--cover-h); box-sizing:border-box; margin:0 28px; padding:36px 0 32px; display:flex; gap:clamp(32px, 5vw, 88px);}
  .cover-text{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; gap:20px;}
  .cover-title{margin-block:auto; font-size:var(--title-size); line-height:.9; font-weight:700; text-transform:uppercase; letter-spacing:-.03em;}
  .cover-title span{color:var(--grey);}
  .cover-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; border-top:1px solid var(--ink); padding-top:10px;}
  .cover-foot img{height:24px; width:auto; display:block;}
  /* a destra: il quadrato centrato nello spazio libero, e sotto "About us →", grande come lo slogan (apre la pagina About us) */
  .cover-side{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:14px; min-height:0;}
  .cover-side .cover-mark{margin-block:auto;}
  .cover-about{flex:none; display:inline-flex; align-items:center; gap:.3em; padding:.08em 0; font-size:calc(var(--title-size) * .82); line-height:.9; font-weight:700; text-transform:uppercase; letter-spacing:-.03em; white-space:nowrap; color:var(--ink); cursor:pointer;}
  .cover-arr{display:inline-block; transition:transform .35s cubic-bezier(.5,0,.2,1);}
  .cover-about:hover .cover-arr, .cover-about:focus-visible .cover-arr{transform:translateX(.25em);}
  /* la freccia va avanti e torna, insieme all'opera che si apre sul taglio nel pittogramma */
  .cover-arr.passo{animation:passo 1.3s cubic-bezier(.75,0,.25,1);}
  @keyframes passo{0%{transform:none;} 45%{transform:translateX(.45em);} 100%{transform:none;}}
  .cover-mark{flex:none; align-self:center; position:relative; width:var(--mark-size, min(46%, calc(var(--cover-h) - 68px))); aspect-ratio:1/1; overflow:hidden;}
  /* dentro il pittogramma le opere passano una alla volta: ogni foto è divisa dal taglio
     e le due metà scorrono in direzioni opposte lungo il taglio, che resta sempre in mezzo */
  .cover-slides{position:absolute; z-index:0; left:4.84%; top:4.84%; width:90.32%; height:90.32%; overflow:hidden; background:var(--paper);}
  .cslide{position:absolute; inset:0; visibility:hidden; z-index:0;}
  .cslide.cur{visibility:visible; z-index:1;}
  .cslide.out{visibility:visible; z-index:2;}
  .cslide img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block; transition:transform 1.3s cubic-bezier(.75,0,.25,1); will-change:transform;}
  .cslide .up{clip-path:polygon(0 0, 100% 0, 100% 21.1%, 0 78.9%);}
  .cslide .dn{clip-path:polygon(0 78.9%, 100% 21.1%, 100% 100%, 0 100%);}
  /* l'opera che esce si apre sul taglio: la metà sopra scivola verso l'alto a destra,
     quella sotto verso il basso a sinistra, e scopre l'opera successiva */
  .cslide.out .up{transform:translate(112%, -64.7%);}
  .cslide.out .dn{transform:translate(-112%, 64.7%);}
  .cslide.cur img{animation:entra 1.3s cubic-bezier(.75,0,.25,1);}
  /* all'apertura della pagina la prima opera arriva da fuori: le due metà entrano lungo il taglio, da direzioni opposte */
  .cslide.attesa img, .cslide.arrivo img{animation:none;}
  .cslide.arrivo img{transition-duration:1.6s;}
  .cslide.attesa .up{transform:translate(112%, -64.7%);}
  .cslide.attesa .dn{transform:translate(-112%, 64.7%);}
  @media (prefers-reduced-motion:reduce){ .cslide.attesa img{transform:none;} }
  @keyframes entra{from{transform:scale(1.08);} to{transform:none;}}
  .cslide.no-tr img{transition:none;}
  .cover-mark svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
  @media (max-width:900px){
    .cover{flex-direction:column; justify-content:space-between; gap:14px; padding:18px 0 16px;}
    .cover-text{display:contents;}
    .cover-mark{order:2; align-self:flex-start; width:var(--mark-size, min(100%, calc(var(--cover-h) - 290px)));}
    .cover{--title-size:clamp(28px, 9vw, 40px);}
    .cover-side{display:contents;}
    .cover-title{order:3;}
    .cover-about{position:absolute; right:0; bottom:16px;}
    .cover-foot{order:4; border-top:none; padding-top:0; min-height:var(--about-h, 40px);}
    .cover-foot img{height:18px;}

  @media (max-width:640px){ .cover{margin:0 16px;} }
  @media (max-width:900px) and (max-height:720px){ .cover-foot{display:none;} .cover{padding-bottom:calc(var(--about-h, 40px) + 26px);} }   /* senza la riga del logo, sotto resta il posto per "About us" */

  /* sezioni una dopo l'altra; i nomi nell'intestazione portano a ciascuna */
  .psec{scroll-margin-top:var(--hdr-h, 70px);}
  /* la linea sopra ogni sezione (come nella "prova taglio"): nera, più spessa, interrotta da un taglio obliquo come nel logo,
     una volta a destra e una a sinistra; si vede anche arrivando dal menu */
  .psec{position:relative; --cut-x:82%;}
  .psec:nth-child(even){--cut-x:18%;}
  .psec:not(#contatti)::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--ink);}
  .psec:not(#contatti)::after{content:""; position:absolute; left:var(--cut-x); top:1.5px; width:60px; height:10px; background:var(--paper); transform:translate(-50%, -50%) rotate(-30deg);}
  .sec-head{margin:0 0 36px;}
  .sec-head .ttl{font-size:clamp(40px, 6vw, 72px); font-weight:700; text-transform:uppercase; line-height:.95; letter-spacing:-.01em;}

  .psec-pad{padding:56px 0 80px;}
  
  /* le sezioni, sulla riga del logo */
  .sec-strip{display:flex; align-items:center; gap:0 48px;}
  /* su schermo largo il menu sta al centro della riga, il logo a sinistra */
  @media (min-width:641px){
    .top{display:grid; grid-template-columns:1fr auto 1fr;}
    .top .sec-strip{grid-column:2; justify-self:center;}
    .top .logo{justify-self:start;}   /* il link del logo resta grande quanto il logo */
  }
  @media (min-width:641px) and (max-width:900px){ .sec-strip{gap:0 28px;} }
  .sec-strip button{font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey); opacity:1; padding:8px 0; cursor:pointer; transition:color .2s;}
  .sec-strip button:hover, .sec-strip button:focus-visible{color:var(--ink); opacity:1;}
  /* passandoci sopra con il cursore la voce si ingrandisce un po' (senza spostare le altre) */
  .sec-strip button{background-image:linear-gradient(currentColor, currentColor); background-repeat:no-repeat; background-size:0% 1px; background-position:left bottom 5px; transition:color .2s, transform .25s var(--ease), background-size .4s var(--ease);}
  @media (hover:hover){ .sec-strip button:hover{transform:scale(1.1);} }
  @media (prefers-reduced-motion: reduce){ .sec-strip button, .lang-switch button, #contatti .contacts dd a{transition:color .2s;} }
  .sec-strip button[aria-current="true"]{color:var(--ink); text-decoration:none; background-size:100% 1px;}
  @media (max-width:640px){

  /* testo che si apre a tendina: About us (primi due paragrafi visibili) e i capitoli dei progetti (primo paragrafo visibile) */
  /* chiuso: si intravedono le prime due righe del testo che segue, che sfumano nel bianco (come nelle biografie) */
  .fold{position:relative; overflow:hidden; max-height:66px; transition:max-height .6s cubic-bezier(.6,0,.2,1);}
  .fold::after{content:""; position:absolute; left:0; right:0; bottom:0; height:66px; background:linear-gradient(to bottom, var(--paper-0), var(--paper) 92%); pointer-events:none; transition:opacity .35s ease;}
  .fold.open::after{opacity:0;}
  .fold-in > p:first-child{margin-top:1em;}
  .fold-toggle[hidden]{display:none;}
  .fold-toggle{display:inline-flex; align-items:center; gap:10px; margin-top:22px; padding:12px 0 4px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); border-bottom:1px solid var(--ink);}
  .fold-toggle::after{content:""; width:7px; height:7px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform .3s ease;}
  .fold-toggle[aria-expanded="true"]::after{transform:translateY(2px) rotate(-135deg);}
  .fold-toggle:hover{opacity:.6;}
  @media (prefers-reduced-motion:reduce){ .fold, .fold-toggle::after{transition:none;} }
  .t-text > .fold-toggle + .catalogs{margin-top:1.6em;}
  /* biografie: la parte visibile è lunga quanto quella di Antonio Alberti; in fondo una sfumatura */
  .t-text{position:relative;}
  .bio-clip{position:relative; overflow:hidden; transition:max-height .6s cubic-bezier(.6,0,.2,1);}
  .bio-clip.cut::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3.4em; background:linear-gradient(to bottom, var(--paper-0), var(--paper)); pointer-events:none; transition:opacity .3s ease;}
  .bio-clip.cut.open::after{opacity:0;}
  .bio-prova{position:absolute; left:0; right:0; top:0; visibility:hidden; pointer-events:none;}
  @media (prefers-reduced-motion:reduce){ .bio-clip{transition:none;} }

  /* schede orizzontali */
  .track-wrap{position:relative;}
  .htrack{display:flex; gap:28px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:14px; scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
  .hcard{flex:0 0 auto; width:min(420px, 78vw); scroll-snap-align:start; display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer;}
  .hpic{position:relative; display:block; width:100%; aspect-ratio:4/5; overflow:hidden; background:var(--frame);}
  .hpic img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; opacity:0; transition:opacity .4s ease, transform .6s var(--ease);}
  .hpic img.on{opacity:1; transition:opacity .5s ease .35s, transform .6s var(--ease);}   /* prima sparisce la vecchia, poi entra la nuova: mai sovrapposte */
  .hcard:hover .hpic img.on{transform:scale(1.02);}
  .hbars{display:flex; gap:3px; height:2px;}
  .hbars i{flex:1; background:var(--line);}
  .hbars i.done{background:var(--ink);}
  .hname{font-size:20px; font-weight:700; text-transform:uppercase; margin-top:6px;}
  .hprev{font-size:13px; line-height:1.55; color:var(--grey); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .hgo{font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--ink); align-self:flex-start; padding-bottom:2px;}
  .hcard:hover .hgo{opacity:.6;}
  /* mentre si trascina con il mouse */
  .trascina{scroll-snap-type:none !important; cursor:grabbing;}
  .trascina *{cursor:grabbing !important;}

  /* opere in fila nella pagina dedicata dell'artista: tutte della stessa altezza */
  .opere{margin-top:16px; border-top:1px solid var(--line); padding-top:14px;}
  .opere h4{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin-bottom:22px;}
  .otrack{display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:14px; scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
  .otrack figure{flex:0 0 auto; scroll-snap-align:start; width:min(420px, 78vw); margin:0;}
  .otrack .ofr{position:relative; display:block; width:100%; aspect-ratio:4/5; background:transparent; overflow:hidden; padding:0; border:0;}   /* niente fondo grigio dietro le opere: si vede solo l'opera, sul bianco della pagina */
  .otrack button.ofr{cursor:pointer;}
  /* titolo dell'opera sotto la foto; la scheda tecnica si apre a tendina */
  .otrack figcaption{margin-top:10px;}
  .opera-tit{display:flex; width:100%; align-items:baseline; justify-content:space-between; gap:14px; padding:2px 0; text-align:left; font-size:13px; line-height:1.35; font-weight:600; color:var(--ink);}

  .opera-tit i::before, .opera-tit i::after{content:""; position:absolute; left:0; right:0; top:5px; height:1.5px; background:currentColor;}
  .opera-tit i::after{transform:rotate(90deg);}
  .sch-open .opera-tit i{transform:rotate(45deg);}

  .opera-sch > div{min-height:0; overflow:hidden;}
  .opera-sch p{margin:0; padding-top:4px; font-size:12px; line-height:1.5; color:var(--grey); letter-spacing:.01em;}

## 03 — THE SPACE AND THE INSTALLATION

*Art d’Enfer* was hosted at **Altrove**, an alternative venue chosen not as a mere container for the event but as an integral part of the curatorial project: the works were not simply placed in the space, but asked to engage with its architecture and the layout of its rooms.

The installation unfolded across **four rooms and an outdoor area**: a route in which different artistic languages coexist and overlap, with no rigid line between exhibition, performance and music night.

![](img/denfer-testo-bn/06.jpg?v=2)
![](img/denfer-testo-bn/pianoforte.jpg)
![](video/denfer-sala.mp4)
![](video/denfer-sala2.mp4)

+++

After the artists were selected, the placement of the works was planned around the features of each room, how it would be experienced and the relationships between the works: painting and photography were in dialogue with design, installations and performances changed how the rooms were perceived, and music ran through the whole route.

The installation thus became a curatorial tool in its own right: not just a way of arranging elements, but a way of building relationships between works, space and audience.

![](img/denfer-testo-bn/mappa.jpg)

---

## 04 — THE NIGHT

At the heart of the project is the direct relationship between electronic music and contemporary art: not an exhibition set beside a music night, but a single environment in which the two coexist, with no set hierarchy.

During the night, Altrove's rooms and outdoor area were inhabited at once by the works, the music and the performances. Visitors moved freely between works and people, while the sound constantly changed how the spaces felt and the context in which the works were seen. The event became a meeting point between a generation of young creatives and an audience from many different backgrounds.

With *Art d’Enfer*, Outframe strengthened its role in building multidisciplinary cultural projects. The collaboration with Nuits d’enfer and Esplika shaped a curatorial model based on scouting new talent and on work between independent organisations, and showed how a music event can become a real opportunity for young artists, and how an alternative venue can be transformed, even temporarily, into an exhibition and performance space.

function stepCard(c) {
  const v = SEZIONI[+c.dataset.sec].voci[+c.dataset.i];

  off.src = v.foto[c._slide]; off.classList.add('on'); on.classList.remove('on');
  c.querySelectorAll('.hbars i').forEach((b, k) => b.classList.toggle('done', k <= c._slide));

const PEEK = 66;   // altezza della parte che si intravede quando il testo è chiuso (vedi .fold)
function piega(btn, box, aperto, scroller) {
  const pieno = box.scrollHeight;
  if (aperto) {
    box.classList.add('open');
    box.style.maxHeight = pieno + 'px';
    setTimeout(() => { if (box.classList.contains('open')) box.style.maxHeight = 'none'; }, 650);
  } else {
    const dopo = btn.getBoundingClientRect().top - (pieno - PEEK);
    if (dopo < 150) {
      scroller.style.overflowAnchor = 'none';
      scroller.scrollTo({ top: Math.max(0, scroller.scrollTop + dopo - innerHeight * .55), behavior: reduceMotion ? 'auto' : 'smooth' });
      setTimeout(() => { scroller.style.overflowAnchor = ''; }, 900);
    }
    box.style.maxHeight = pieno + 'px'; void box.offsetHeight;
    box.classList.remove('open'); box.style.maxHeight = '';
  }
  box.inert = !aperto;
  btn.setAttribute('aria-expanded', aperto);
  btn.textContent = t(aperto ? 'aboutLess' : 'aboutMore');
}

// con il mouse le file (schede, opere, foto) si possono trascinare di lato; un semplice clic apre come prima
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  const tr = e.target.closest('.htrack, .otrack, .riga');
  if (!tr || tr.scrollWidth <= tr.clientWidth + 4) return;
  const x0 = e.clientX, s0 = tr.scrollLeft; let mosso = false;
  const muovi = ev => {
    const dx = ev.clientX - x0;
    if (!mosso && Math.abs(dx) > 6) { mosso = true; tr.classList.add('trascina'); }
    if (mosso) { tr.scrollLeft = s0 - dx; ev.preventDefault(); }
  };
  const lascia = () => {
    removeEventListener('pointermove', muovi); removeEventListener('pointerup', lascia);
    tr.classList.remove('trascina');
    if (mosso) {   // dopo un trascinamento il clic non apre la scheda o la foto
      const ferma = ev => { ev.stopPropagation(); ev.preventDefault(); };
      tr.addEventListener('click', ferma, { capture: true, once: true });
      setTimeout(() => tr.removeEventListener('click', ferma, true), 0);
    }
  };
  addEventListener('pointermove', muovi); addEventListener('pointerup', lascia);
});

const cover = document.getElementById('cover');

// su telefono e tablet l'altezza della copertina si fissa all'apertura e cambia solo se cambia la larghezza
// (rotazione dello schermo): la barra del browser che compare e sparisce mentre si scorre non fa più saltare la pagina
const touchScreen = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
let coverW = 0, coverH = 0;
function fitCover() {
  if (!cover) return;
  const topDoc = cover.getBoundingClientRect().top + window.scrollY;
  const stretto = window.matchMedia('(max-width:900px)').matches;
  let h;
  if (touchScreen && coverH && coverW === window.innerWidth) h = coverH;
  else { h = Math.max(stretto ? 340 : 380, Math.round(window.innerHeight - topDoc)); coverW = window.innerWidth; coverH = h; }
  cover.style.setProperty('--cover-h', h + 'px');
  cover.style.setProperty('--about-h', coverGo.offsetHeight + 'px');
  // lato del quadrato: quello che resta dopo i testi
  const cs = getComputedStyle(cover), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), gap = parseFloat(cs.rowGap) || 0;
  let lato;
  if (stretto) {
    const altri = [...cover.querySelectorAll('.cover-title, .cover-foot')].filter(el => el.offsetParent);
    lato = h - pad - altri.reduce((t, el) => t + el.offsetHeight, 0) - gap * altri.length;
    lato = Math.min(cover.clientWidth, lato);
  } else lato = Math.min(cover.clientWidth * .46, h - pad - coverGo.offsetHeight - 14);   // sotto il quadrato resta il posto per "About us"
  cover.style.setProperty('--mark-size', Math.max(120, Math.floor(lato)) + 'px');
}

// copertina: ogni 4,5 secondi l'opera nel pittogramma si apre sul taglio e lascia il posto alla successiva
(function () {
  const slides = [...document.querySelectorAll('.cover-slides .cslide')];
  const prima = slides[0], arr = document.querySelector('.cover-arr');
  if (slides.length < 2 || reduceMotion) { if (prima) prima.classList.remove('attesa'); return; }
  const passo = () => { if (arr) { arr.classList.remove('passo'); void arr.offsetWidth; arr.classList.add('passo'); } };
  // la prima opera si carica subito; le altre dopo, così la pagina si apre prima
  const carica = () => document.querySelectorAll('.cover-slides img[data-src]').forEach(im => { im.src = im.dataset.src; im.removeAttribute('data-src'); });
  if (document.readyState === 'complete') carica(); else window.addEventListener('load', carica);
  const pronta = el => [...el.querySelectorAll('img')].every(im => im.complete && im.naturalWidth > 0 && !im.dataset.src);
  let i = 0;
  const giro = () => {
    if (document.hidden) return;
    const a = slides[i], b = slides[(i + 1) % slides.length];
    if (!pronta(b)) return;   // l'opera successiva non è ancora arrivata: si aspetta il giro dopo
    a.classList.remove('cur', 'arrivo'); a.classList.add('out');
    b.classList.add('cur');
    passo();   // la freccia di About us segue lo stesso ritmo
    setTimeout(() => {
      a.classList.add('no-tr'); a.classList.remove('out');
      void a.offsetWidth; a.classList.remove('no-tr');
    }, 1450);
    i = (i + 1) % slides.length;
  };
  // la prima opera entra solo quando è caricata E la copertina si vede davvero sullo schermo
  // (pagina in primo piano, logo in vista): così l'arrivo non si consuma prima che qualcuno guardi
  let partita = false;
  const arriva = () => {
    if (partita) return; partita = true;
    setTimeout(() => {
      prima.classList.add('arrivo'); prima.classList.remove('attesa');
      passo();
      setTimeout(() => setInterval(giro, 4500), 1600);
    }, 700);
  };
  const im = prima.querySelector('img');
  const caricata = new Promise(r => { if (im.complete && im.naturalWidth) r(); else { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); } });
  const inVista = new Promise(r => {
    const mark = document.querySelector('.cover-mark');
    if (!('IntersectionObserver' in window) || !mark) return r();
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); r(); } }, { threshold: .5 });
    io.observe(mark);
  });
  const visibile = new Promise(r => { if (document.visibilityState === 'visible') r(); else document.addEventListener('visibilitychange', function f() { if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', f); r(); } }); });
  Promise.all([caricata, inVista, visibile]).then(arriva);
})();

function anteprimaHtml(src) {

function testoHtml(src) {
  const inline = inlineMd;
  const imgRe = /^!\[(.*?)\]\((.+?)\)$/;
  const catRe = /^\[!\[(.*?)\]\((.+?)\)\]\(catalogo:([a-z0-9-]+)\)$/;
  const secs = [{ text: '', figs: [] }];
  let credits = [];
  const cur = () => secs[secs.length - 1];
  const flush = () => { if (credits.length) { cur().text += `<div class="credits">${credits.join('')}</div>`; credits = []; } };
  src.trim().split(/\n\s*\n/).forEach(b => {
    b = b.trim();
    if (!b || b === '---' || b.startsWith('# ')) return;
    if (b === '+++') { flush(); secs.push({ text: '', figs: [], sub: true }); return; }   // nuovo blocco nello stesso capitolo
    if (b.startsWith('## ')) { flush(); secs.push({ text: `<h4>${inline(b.slice(3).replace(/^\d+\s*[—-]\s*/, ''))}</h4>`, figs: [] }); return; }
    if (b.startsWith('### ')) { flush(); cur().text += `<h5>${inline(b.slice(4))}</h5>`; return; }
    const ls = b.split('\n');
    if (ls.every(l => catRe.test(l.trim()))) {
      flush();
      cur().text += `<div class="catalogs">${ls.map(l => { const [, tt, src, id] = l.trim().match(catRe);
        return `<button class="catalog" data-cat="${esc(id)}"><img src="${esc(src)}" alt="${esc(tt)}" loading="lazy"><span class="cat-title">${esc(tt)}</span><span class="cat-go">${t('browse')}</span></button>`; }).join('')}</div>`;
      return;
    }
    if (ls.every(l => imgRe.test(l.trim()))) {
      // le foto non vanno sotto il testo: finiscono nella colonna accanto alla loro sezione
      ls.forEach(l => { const [, alt, src] = l.trim().match(imgRe);
        const media = /\.(mp4|webm|mov)$/i.test(src)
          ? `<video src="${esc(src)}" poster="${esc(src.replace(/\.\w+$/, '.jpg'))}" autoplay muted loop playsinline preload="metadata" aria-label="${esc(alt || 'Video')}"></video>`
          : `<img src="${esc(src)}" alt="${esc(alt.replace(/\*/g, ''))}" loading="lazy">`;
        cur().figs.push(`<figure>${media}${alt ? `<figcaption>${inlineMd(alt)}</figcaption>` : ''}</figure>`); });
      return;
    }
    if (ls.every(l => l.trim().startsWith('>'))) {
      flush();
      const r = ls.map(l => l.trim().replace(/^>\s?/, '')), firma = /^[—-]\s/.test(r[r.length - 1]) ? r.pop().replace(/^[—-]\s*/, '') : '';
      cur().text += `<blockquote class="citazione"><p>${inline(r.join(' '))}</p>${firma ? `<cite>${inline(firma)}</cite>` : ''}</blockquote>`;

    flush();
    cur().text += `<p>${ls.map(inline).join('<br>')}</p>`;
  });
  flush();
  return secs.filter(x => x.text || x.figs.length).map(x => sezioneHtml(x.text, x.figs, x.sub)).join('');
}

// opere degli artisti: la fila è curva, come vista dall'interno di un cilindro. L'opera al centro è dritta e di fronte;
// allontanandosi dal centro ogni opera gira sempre di più verso chi guarda (il bordo esterno diventa più alto)
// e le opere ruotate si avvicinano tra loro, così se ne vedono di più ai lati
const curvaAng = t => Math.min(72, 40 * t);                          // gradi di rotazione a t opere dal centro
const curvaK = t => 1 + .06 * Math.min(t, 3);                         // ai lati un po' più vicine

function curvaPos(d) {                                                // dove finisce il centro dell'opera, in "opere"
  const n = Math.ceil(Math.abs(d) / .05); let x = 0;
  for (let k = 0; k < n; k++) { const a = Math.abs(d) * k / n, b = Math.abs(d) * (k + 1) / n; x += (curvaLarg(a) + curvaLarg(b)) / 2 * (b - a); }
  return Math.sign(d) * x;
}
function curvaOpere() {
  const tr = document.getElementById('otrack');

  const centro = tr.scrollLeft + tr.clientWidth / 2;
  tr.querySelectorAll(':scope > figure').forEach(f => {
    const w = f.offsetWidth, u = w + 12, sx = f.offsetLeft + w / 2 - centro, d = sx / u;
    const t = Math.abs(d), x = curvaPos(d) * u - sx, g = f.querySelector('.gira');
    if (!g) return;
    g.style.transform = reduceMotion ? '' :
      `translateX(${x.toFixed(1)}px) scale(${curvaK(t).toFixed(3)}) perspective(1000px) rotateY(${(-Math.sign(d) * curvaAng(t)).toFixed(2)}deg)`;
    f.style.zIndex = 100 - Math.round(t * 10);

}

// pagine degli artisti: in fondo c'è abbastanza spazio perché, scorrendo fino alla fine,

vStage.addEventListener('pointerup', e => {
  if (vsx === null) return;
  const dx = e.clientX - vsx, dy = e.clientY - vsy; vsx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) return vGo(dx < 0 ? 1 : -1);
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) { const r = vStage.getBoundingClientRect(); vGo(e.clientX - r.left > r.width / 2 ? 1 : -1); }
});
window.addEventListener('resize', () => { if (!viewer.hidden && vCat) vLayout(); });
// clic sulle copertine dei cataloghi nel testo
document.addEventListener('click', e => { const c = e.target.closest('.catalog[data-cat], .cat-link[data-cat]'); if (c) openViewer(c.dataset.cat); });


/* ---------- tornare indietro: tasto/gesto del browser, trackpad, dito ---------- */
// ogni livello aperto (sezione, pagina dedicata, catalogo) è una voce della cronologia
let skipPop = 0;
function pushLayer(layer, hash) { if (rerendering) return; try { history.pushState({ layer }, '', hash || location.pathname); } catch (e) {} }
function popLayer(layer, fromPop) {
  // chiusura con i pulsanti del sito: tolgo anche la voce dalla cronologia
  if (!fromPop && history.state && history.state.layer === layer) { skipPop++; try { history.back(); } catch (e) { skipPop--; } }
}
/* ---------- foto a tutto schermo ---------- */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
let lbList = [], lbI = 0, lbFrom = null;
// le foto della pagina aperta, nell'ordine in cui si vedono (non i video, non le foto nascoste su questo schermo)
const lbFoto = () => [...document.querySelectorAll('#artBody .art-hero img, #artBody .t-figs img, #artBody .otrack img')].filter(im => im.getClientRects().length);
function lbDidascalia(im) {
  const fig = im.closest('.otrack figure');
  if (fig) {
    const tit = fig.querySelector('.opera-tit span, .opera-tit');
    const righe = [...fig.querySelectorAll('.opera-sch p')].map(p => `<span>${esc(p.textContent)}</span>`).join('<br>');
    return tit ? `<strong>${esc(tit.textContent)}</strong>${righe}` : '';
  }
  const h4 = im.closest('.t-sec') && im.closest('.t-sec').querySelector('h4');
  const cap = im.closest('figure') && im.closest('figure').querySelector('figcaption');
  return (h4 ? `<span class="lb-sec">${esc(h4.textContent)}</span>` : `<span class="lb-sec">${esc(document.getElementById('artTitle').textContent)}</span>`) + (cap ? `<br>${esc(cap.textContent)}` : '');
}
function lbShow() {
  const im = lbList[lbI];
  lbImg.classList.add('load');
  const src = im.currentSrc || im.src;
  const pre = new Image();
  pre.onload = pre.onerror = () => { lbImg.src = src; lbImg.alt = im.alt || ''; lbImg.classList.remove('load'); lbSfondo(src); };
  pre.src = src;
  document.getElementById('lbCap').innerHTML = lbDidascalia(im);
  document.getElementById('lbCount').textContent = lbList.length > 1 ? `${lbI + 1} / ${lbList.length}` : '';
  document.getElementById('lbPrev').hidden = document.getElementById('lbNext').hidden = lbList.length < 2;
  [1, -1].forEach(d => { const n = lbList[(lbI + d + lbList.length) % lbList.length]; if (n) new Image().src = n.currentSrc || n.src; });
}
// sfondo della foto a tutto schermo: solo nelle pagine degli artisti
const lbBg = document.getElementById('lbBg'); let lbBgK = 0;
function lbSfondo(src) {
  const on = article.classList.contains('pag-artista') && !article.hidden;
  lb.classList.toggle('sfondo-opera', on);
  if (!on) return;
  const [a, b] = lbBg.children, nuovo = lbBgK ? a : b, vecchio = lbBgK ? b : a;
  lbBgK = 1 - lbBgK;
  nuovo.style.backgroundImage = `url("${src.replace(/["\\]/g, '\\$&')}")`;
  nuovo.classList.add('on'); vecchio.classList.remove('on');
}
function lbOpen(im) {
  lbList = lbFoto(); lbI = Math.max(0, lbList.indexOf(im)); lbFrom = document.activeElement;
  lb.hidden = false; lbShow();
  pushLayer('lb', location.hash);
  document.getElementById('lbClose').focus({ preventScroll: true });
}
function lbClose(fromPop) {
  if (lb.hidden) return;
  lb.hidden = true; lbImg.removeAttribute('src');
  [...lbBg.children].forEach(i => { i.classList.remove('on'); i.style.backgroundImage = ''; });
  popLayer('lb', fromPop);
  if (lbFrom && lbFrom.focus) lbFrom.focus({ preventScroll: true });
}
const lbGo = d => { if (lbList.length > 1) { lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); } };
document.getElementById('lbClose').addEventListener('click', () => lbClose());
document.getElementById('lbPrev').addEventListener('click', () => lbGo(-1));
document.getElementById('lbNext').addEventListener('click', () => lbGo(1));
document.getElementById('lbStage').addEventListener('click', e => { if (e.target === e.currentTarget) lbClose(); });   // toccando fuori dalla foto si chiude
// dito verso sinistra o destra: foto successiva o precedente
let lbx = null, lby = null;
lb.addEventListener('touchstart', e => { if (e.touches.length === 1) { lbx = e.touches[0].clientX; lby = e.touches[0].clientY; } else lbx = null; }, { passive: true });
lb.addEventListener('touchend', e => {
  if (lbx === null) return;
  const dx = e.changedTouches[0].clientX - lbx, dy = e.changedTouches[0].clientY - lby; lbx = null;
  if (Math.abs(dx) > 50 && Math.abs(dy) < 80) lbGo(dx < 0 ? 1 : -1);
}, { passive: true });

function goBack() {
  if (!lb.hidden) lbClose();
  else if (!viewer.hidden) closeViewer();
  else if (!article.hidden) closeArticle();
}
window.addEventListener('popstate', () => {
  if (skipPop) {
    skipPop--;
    // dal logo: il browser rimette la posizione che la pagina aveva prima, quindi subito dopo si torna in cima
    if (homeDopo) { homeDopo = false; const su = () => window.scrollTo(0, 0); su(); requestAnimationFrame(su); setTimeout(su, 80); }
    return;
  }
  if (!lb.hidden) lbClose(true);
  else if (!viewer.hidden) closeViewer(true);
  else if (!article.hidden) closeArticle(true);
});
const anyLayer = () => !viewer.hidden || !article.hidden;
const scrollsSideways = t => { const st = t.closest && t.closest('.htrack, .otrack'); return st && st.scrollWidth > st.clientWidth + 2; };
// trackpad: due dita verso destra
let wAcc = 0, wTimer = null, wLock = false;
window.addEventListener('wheel', e => {
  if (!anyLayer() || !viewer.hidden || !lb.hidden) return;   // nel catalogo e nelle foto il gesto sfoglia
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) * 1.5 || scrollsSideways(e.target)) return;
  e.preventDefault();                                      // evito che il browser lasci il sito
  wAcc += e.deltaX; clearTimeout(wTimer); wTimer = setTimeout(() => { wAcc = 0; }, 250);
  if (wAcc < -140 && !wLock) { wLock = true; wAcc = 0; goBack(); setTimeout(() => { wLock = false; }, 900); }
}, { passive: false });
// telefono: dito verso destra
let tx = null, ty = null;
window.addEventListener('touchstart', e => {
  const t = e.touches[0]; tx = null;
  if (!anyLayer() || !viewer.hidden || !lb.hidden || e.touches.length > 1 || scrollsSideways(e.target)) return;
  tx = t.clientX; ty = t.clientY;
}, { passive: true });
window.addEventListener('touchend', e => {
  if (tx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty; tx = null;
  if (dx > 90 && Math.abs(dy) < 60) goBack();
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!lb.hidden) { if (e.key === 'Escape') lbClose(); if (e.key === 'ArrowRight') lbGo(1); if (e.key === 'ArrowLeft') lbGo(-1); return; }
  if (!viewer.hidden) { if (e.key === 'Escape') closeViewer(); if (e.key === 'ArrowRight') vGo(1); if (e.key === 'ArrowLeft') vGo(-1); return; }
  if (!article.hidden) { if (e.key === 'Escape') closeArticle(); return; }
});

/* ---------- cambio lingua ---------- */
let rerendering = false;
function renderLangSwitches() {
  document.querySelectorAll('.lang-switch').forEach(box => {
    const bs = box.querySelectorAll('[data-lang]');
    if (bs.length === 2) { bs.forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG)); return; }
    box.innerHTML = ['it', 'en'].map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === LANG}" lang="${l}">${l.toUpperCase()}</button>`).join('');
  });
}
function applyStaticTexts() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
}
function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  try { localStorage.setItem('outframe-lang', l); } catch (e) {}
  applyLangData(); applyStaticTexts(); renderLangSwitches(); renderTemaBtns();
  const y = window.scrollY; renderPage(); window.scrollTo(0, y);
  rerendering = true;
  if (!article.hidden) { const ay = article.scrollTop; aboutOpen ? openAbout() : openArticle(projActive); article.scrollTop = ay; }
  if (!viewer.hidden && vCat) { document.getElementById('vTitle').innerHTML = corsivo(vCat.titolo); vUpdate(); }
  rerendering = false;
}
document.addEventListener('click', e => { const b = e.target.closest('.lang-switch button[data-lang]'); if (b) { e.stopPropagation(); setLang(b.dataset.lang); } }, true);

/* ---------- giorno / notte ----------
   All'inizio il sito segue il telefono o il computer del visitatore (modalità chiara o scura);
   il cerchio accanto a IT/EN cambia a mano, e la scelta resta salvata nel suo browser. */
const TEMA_ICONA = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.6a6.4 6.4 0 0 0 0 12.8z" fill="currentColor"/></svg>';
let temaScelto = null;
try { const v = localStorage.getItem('outframe-tema'); if (v === 'giorno' || v === 'notte') temaScelto = v; } catch (e) {}
const scuroSistema = window.matchMedia('(prefers-color-scheme: dark)');
const temaAttuale = () => document.documentElement.dataset.tema === 'notte' ? 'notte' : 'giorno';
function renderTemaBtns() {
  const notte = temaAttuale() === 'notte', lab = t(notte ? 'temaGiorno' : 'temaNotte');
  document.querySelectorAll('.tema-btn').forEach(b => { if (!b.firstChild) b.innerHTML = TEMA_ICONA; b.setAttribute('aria-pressed', notte); b.setAttribute('aria-label', lab); b.title = lab; });
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = notte ? '#FFFFFF' : '#0d0c0a';   // il colore della barra del browser sul telefono segue la fascia in alto
}
function setTema(tm, salva) {
  const root = document.documentElement;
  if (!reduceMotion) { root.classList.add('tema-shift'); clearTimeout(setTema.timer); setTema.timer = setTimeout(() => root.classList.remove('tema-shift'), 750); }
  root.dataset.tema = tm;
  if (salva) { temaScelto = tm; try { localStorage.setItem('outframe-tema', tm); } catch (e) {} }
  renderTemaBtns();
}
document.addEventListener('click', e => { const b = e.target.closest('.tema-btn'); if (b) { e.stopPropagation(); setTema(temaAttuale() === 'notte' ? 'giorno' : 'notte', true); } }, true);
scuroSistema.addEventListener('change', e => { if (!temaScelto) setTema(e.matches ? 'notte' : 'giorno', false); });
if (document.documentElement.dataset.tema !== 'notte' && document.documentElement.dataset.tema !== 'giorno') document.documentElement.dataset.tema = temaScelto || (scuroSistema.matches ? 'notte' : 'giorno');
renderTemaBtns();
applyLangData(); applyStaticTexts(); renderLangSwitches();

// avvio: con #progetti, #artisti… nel link si arriva direttamente a quella parte della pagina
const hashSec = location.hash.slice(1);
renderPage();
if (hashSec === 'about') { rerendering = true; openAbout(); rerendering = false; }   // link diretto alla pagina About us
else if (SEZIONI.some(s => s.id === hashSec)) document.getElementById(hashSec).scrollIntoView();
else if (hashSec) {
  // link diretto a un progetto o a un artista (#il-peso-del-cielo, #antonio-alberti…): si apre la sua pagina,
  // e sotto il sito è già alla sezione giusta, così chiudendo si ritrovano le schede
  SEZIONI.some((s, si) => (s.voci || []).some((v, i) => {
    if (!v.testo || slug(v.nome) !== hashSec) return false;
    document.getElementById(s.id).scrollIntoView();
    active = si; projActive = i;
    rerendering = true; openArticle(i); rerendering = false;
    return true;
  }));
}
</script>
</body>
</html>
